<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Versión para 16-32 px (favicon, barra de tareas): el mismo arcade, más grande y con menos
       detalle; el fondo ocupa todo el cuadro, que a ese tamaño no hay margen que valga -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2724"/>
      <stop offset="1" stop-color="#151211"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9670f2"/>
      <stop offset="1" stop-color="#7f56e3"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="200" fill="url(#tile)"/>
  <!-- Mueble y marquesina -->
  <rect x="282" y="150" width="460" height="770" rx="40" fill="url(#body)"/>
  <rect x="250" y="96" width="524" height="150" rx="44" fill="#d7c8ff"/>
  <!-- Pantalla con tres filas, la del medio seleccionada -->
  <rect x="322" y="290" width="380" height="350" rx="36" fill="#151211"/>
  <rect x="364" y="336" width="296" height="48" rx="24" fill="#7e7570"/>
  <rect x="354" y="420" width="316" height="72" rx="24" fill="#f3f0ee"/>
  <rect x="364" y="528" width="230" height="48" rx="24" fill="#7e7570"/>
  <!-- Panel de mandos -->
  <path d="M300 680 h424 l50 84 h-524 z" fill="#4f3297"/>
</svg>
