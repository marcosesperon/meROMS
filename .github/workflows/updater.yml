# Builds latest.json (what the app's updater reads) when a Release is published, from the
# installers and .sig files the build workflow attached, with the Release notes as they are
# at publish time. Drafts never reach users: "releases/latest" only points to published ones.
# It can also be run by hand (Actions > Update manifest > Run workflow) after editing the notes.
name: Update manifest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = latest published)"
        required: false

permissions:
  contents: write

jobs:
  latest-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.payload.release?.tag_name || context.payload.inputs?.tag;
            const release = tag
              ? (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data
              : (await github.rest.repos.getLatestRelease({ owner, repo })).data;

            // Contents of a small asset (the .sig files)
            async function assetText(asset) {
              const res = await github.request("GET /repos/{owner}/{repo}/releases/assets/{asset_id}", {
                owner, repo, asset_id: asset.id, headers: { accept: "application/octet-stream" },
              });
              return Buffer.from(res.data).toString("utf8").trim();
            }

            // Updater platform keys for each kind of file (the plain key is the default one)
            const kinds = [
              { suffix: ".app.tar.gz", keys: ["darwin-x86_64", "darwin-aarch64", "darwin-x86_64-app", "darwin-aarch64-app"] },
              { suffix: "-setup.exe", keys: ["windows-x86_64", "windows-x86_64-nsis"] },
              { suffix: ".msi", keys: ["windows-x86_64-msi"] },
              { suffix: ".AppImage", keys: ["linux-x86_64", "linux-x86_64-appimage"] },
              { suffix: ".deb", keys: ["linux-x86_64-deb"] },
              { suffix: ".rpm", keys: ["linux-x86_64-rpm"] },
            ];
            const platforms = {};
            for (const kind of kinds) {
              const file = release.assets.find((a) => a.name.endsWith(kind.suffix));
              const sig = file && release.assets.find((a) => a.name === file.name + ".sig");
              if (!file || !sig) {
                core.warning(`No signed ${kind.suffix} in ${release.tag_name}`);
                continue;
              }
              const entry = { signature: await assetText(sig), url: file.browser_download_url };
              for (const key of kind.keys) platforms[key] = entry;
            }
            if (Object.keys(platforms).length === 0) {
              core.setFailed("No signed update files: was the build made with TAURI_SIGNING_PRIVATE_KEY?");
              return;
            }

            const manifest = {
              version: release.tag_name.replace(/^v/, ""),
              notes: release.body || "",
              pub_date: release.published_at || new Date().toISOString(),
              platforms,
            };

            // Replace the previous latest.json of this Release, if any
            const old = release.assets.find((a) => a.name === "latest.json");
            if (old) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: release.id, name: "latest.json",
              data: JSON.stringify(manifest, null, 2),
              headers: { "content-type": "application/json" },
            });
            core.info(`latest.json for ${manifest.version}: ${Object.keys(platforms).join(", ")}`);
